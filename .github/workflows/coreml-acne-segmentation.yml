name: Convert Verified Acne Pixel Segmentation to Core ML

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreml-acne-segmentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            scripts/requirements-coreml.lock.txt
            scripts/requirements-coreml-acne-seg.lock.txt
      - name: Install hash-pinned binary conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-coreml-acne-seg.lock.txt
      - name: Download verified public tensor weights and compare real Core ML pixels
        shell: bash
        env:
          ARTIFACTS: ${{ runner.temp }}/ruyuan-acne-segmentation
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS"
          python -u scripts/convert_acne_segmentation.py --download --output "$ARTIFACTS" 2>&1 | tee "$ARTIFACTS/conversion.log"
          python -m pip freeze > "$ARTIFACTS/installed-dependencies.txt"
      - name: Upload actual model and parity evidence or failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ruyuan-AcneSegmentation-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ruyuan-acne-segmentation/Ruyuan-AcneSegmentation.zip
            ${{ runner.temp }}/ruyuan-acne-segmentation/AcneSegmentation-resource-manifest.json
            ${{ runner.temp }}/ruyuan-acne-segmentation/AcneSegmentation-fixture-reference.json
            ${{ runner.temp }}/ruyuan-acne-segmentation/conversion-failed.json
            ${{ runner.temp }}/ruyuan-acne-segmentation/*.log
            ${{ runner.temp }}/ruyuan-acne-segmentation/*.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
