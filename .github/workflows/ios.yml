name: iOS Simulator Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # An installed, stable Xcode on the macos-15 image; no SDK downloads.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run XCTest on an available iPhone simulator
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ruyuan-ci
        shell: bash
        run: bash scripts/ci-ios.sh

      - name: Upload simulator app, logs and XCTest results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ruyuan-iOS-Simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ruyuan-ci/*.log
            ${{ runner.temp }}/ruyuan-ci/*.json
            ${{ runner.temp }}/ruyuan-ci/*.txt
            ${{ runner.temp }}/ruyuan-ci/*.xcresult.zip
            ${{ runner.temp }}/ruyuan-ci/Ruyuan-Simulator.app.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
