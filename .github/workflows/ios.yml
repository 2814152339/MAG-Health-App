name: iOS Simulator Build & Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      # Pinned installed arm64 runner/toolchain; avoids observed macOS15 capacity failure.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile, run all XCTest, then record synthetic scanner playback
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ruyuan-ci
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/ci-ios.sh

      - name: Upload simulator app, XCTest results and synthetic scan recording
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ruyuan-iOS-Simulator-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ruyuan-ci/*.log
            ${{ runner.temp }}/ruyuan-ci/*.json
            ${{ runner.temp }}/ruyuan-ci/*.txt
            ${{ runner.temp }}/ruyuan-ci/*.xcresult.zip
            ${{ runner.temp }}/ruyuan-ci/Ruyuan-Simulator.app.zip
            ${{ runner.temp }}/ruyuan-ci/TestAttachments.zip
            ${{ runner.temp }}/ruyuan-ci/ScanMotion-Synthetic.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
